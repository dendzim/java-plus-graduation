server:
  port: 0

spring:
  application:
    name: event-service
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ewm_event
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ALWAYS
      schema-locations: classpath:schema.sql
  jackson:
    serialization:
      INDENT_OUTPUT: true
logging:
  level:
    root: info
    org:
      zalando:
        logbook: trace

eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: event-service:${random.value}