server:
  port: 0

spring:
  application:
    name: stats-server
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm-stats
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    serialization:
      INDENT_OUTPUT: true
eureka:
  instance:
    hostname: localhost
    preferIpAddress: false
    instance-id: stats-server:${random.value}