spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ewm-stats
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 0

eureka:
  client:
    enabled: false

logging:
  level:
    ru.practicum: DEBUG