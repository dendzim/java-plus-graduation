server:
  port: 8080

spring:
  output:
    ansi:
      enabled: ALWAYS
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: requests_all
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**, /users/{userId}/events/{eventId}/requests/**

        - id: ratings_all
          uri: lb://rating-service
          predicates:
            - Path=/users/*/events/*/likes/**

        - id: compilations_all
          uri: lb://event-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**

        - id: categories_all
          uri: lb://event-service
          predicates:
            - Path=/categories/**, /admin/categories/**

        - id: events_all
          uri: lb://event-service
          predicates:
            - Path=/events/**, /users/*/events/**, /admin/events/**

        - id: users_all
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**