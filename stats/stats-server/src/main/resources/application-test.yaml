spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  application:
    name: stats-server
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ewm-stats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 0

eureka:
  client:
    enabled: false

logging:
  level:
    ru.practicum: DEBUG