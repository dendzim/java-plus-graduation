spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  application:
    name: main-service
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      schema-locations: classpath:schema-h2.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ewm-main;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE

server:
  port: 0

eureka:
  client:
    enabled: false

logging:
  level:
    ru.practicum: DEBUG